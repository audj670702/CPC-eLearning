name: Apply INFOSPE deep link

'on':
  push:
    paths:
      - '.github/workflows/apply-infospe-deeplink.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch CPC app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.js')
          source = path.read_text(encoding='utf-8')

          source = source.replace(
              "  bindUI();\n  initTvPlayer();\n}",
              "  bindUI();\n  initTvPlayer();\n  if (isInfospeDeepLink()) openInfospe();\n}"
          )

          marker = "function bindUI() {"
          helpers = r'''function isInfospeDeepLink() {
  return String(new URLSearchParams(window.location.search).get('modulo') || '').toLowerCase() === 'infospe';
}

function syncInfospeUrl(open) {
  const url = new URL(window.location.href);
  if (open) url.searchParams.set('modulo', 'infospe');
  else url.searchParams.delete('modulo');
  history.replaceState({}, document.title, `${url.pathname}${url.search}${url.hash}`);
}

function openInfospe() {
  const modal = document.getElementById('infospeModal');
  if (!modal) return;
  modal.hidden = false;
  document.body.classList.add('modal-open');
  syncInfospeUrl(true);
}

function closeInfospe() {
  const modal = document.getElementById('infospeModal');
  if (!modal) return;
  modal.hidden = true;
  document.body.classList.remove('modal-open');
  syncInfospeUrl(false);
}

'''
          if helpers not in source:
              if marker not in source:
                  raise SystemExit('No se encontró bindUI()')
              source = source.replace(marker, helpers + marker, 1)

          old_open = """  infospeModule?.addEventListener('click', () => {\n    infospeModal.hidden = false;\n    document.body.classList.add('modal-open');\n  });"""
          source = source.replace(old_open, "  infospeModule?.addEventListener('click', openInfospe);")

          old_close = """  infospeClose?.addEventListener('click', () => {\n    infospeModal.hidden = true;\n    document.body.classList.remove('modal-open');\n  });"""
          source = source.replace(old_close, "  infospeClose?.addEventListener('click', closeInfospe);")

          old_overlay = """  infospeModal?.addEventListener('click', (event) => {\n    if (event.target === infospeModal) {\n      infospeModal.hidden = true;\n      document.body.classList.remove('modal-open');\n    }\n  });"""
          source = source.replace(old_overlay, """  infospeModal?.addEventListener('click', (event) => {\n    if (event.target === infospeModal) closeInfospe();\n  });""")

          source = source.replace('v0.2.7 | 2026', 'v0.2.8 | 2026')

          required = [
              "if (isInfospeDeepLink()) openInfospe();",
              "function openInfospe()",
              "function closeInfospe()",
              "syncInfospeUrl(true)",
              "infospeModule?.addEventListener('click', openInfospe);",
              "v0.2.8 | 2026"
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit('Faltan cambios: ' + ', '.join(missing))

          path.write_text(source, encoding='utf-8')

          sw_path = Path('service-worker.js')
          sw = sw_path.read_text(encoding='utf-8')
          sw = sw.replace("cpc-elearning-v0.3.8", "cpc-elearning-v0.3.9")
          sw_path.write_text(sw, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "SCaD Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app.js service-worker.js
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "feat: add shareable INFOSPE deep link"
          git push

