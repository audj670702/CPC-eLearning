name: Update INFOSPE duration

on:
  push:
    paths:
      - '.github/workflows/update-infospe-duration.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update text
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('app.js'); s=p.read_text(encoding='utf-8'); old='El período de impartición del curso base se realiza en 12 sesiones, una por semana.'; new='El período de impartición del curso base se realiza en 15 semanas.'; assert old in s, 'Texto origen no encontrado'; p.write_text(s.replace(old,new,1), encoding='utf-8')"
      - name: Commit
        shell: bash
        run: |
          git config user.name "SCaD Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app.js
          git commit -m "fix: update INFOSPE course duration to 15 weeks"
          git push
