<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mensajería · SCaD MNS</title>
<style>
:root{--bg:#f6f8fb;--surface:#fff;--ink:#0d2342;--muted:#62758e;--line:#dce5ef;--blue:#0e67d7;--red:#ef1b23;--violet:#eee8ff;--shadow:0 8px 24px rgba(16,52,91,.08)}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.shell{height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.top{height:58px;flex:none;background:#fff;border-bottom:1px solid var(--line);padding:8px 12px;display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center}.brand{font-size:24px}.title{font-size:18px;font-weight:900}.close{border:0;background:transparent;font-size:25px;color:var(--ink)}
.global{min-width:28px;height:28px;padding:0 7px;border-radius:999px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:900;animation:pulse 1.6s infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,27,35,.4)}65%{box-shadow:0 0 0 9px rgba(239,27,35,0)}100%{box-shadow:0 0 0 0 rgba(239,27,35,0)}}
.main{flex:1;min-height:0;overflow:auto;padding:12px 14px 22px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.quick button{min-height:52px;border:1px solid var(--line);background:#fff;border-radius:14px;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:7px;position:relative}.quick .ico{font-size:21px}.att-badge{position:absolute;right:7px;top:6px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:9px;animation:pulse 1.6s infinite}
.toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;margin-bottom:11px}.search{position:relative}.search input{width:100%;height:42px;border:1px solid var(--line);border-radius:13px;background:#fff;padding:0 36px 0 12px;outline:none}.search span{position:absolute;right:11px;top:9px;color:var(--muted);font-size:18px}.filter{height:42px;border:1px solid #9fc3ee;background:#fff;border-radius:12px;padding:0 10px;font-size:11px;font-weight:800}.filter.on{border-color:var(--blue);color:var(--blue);background:#edf5ff}.new{width:42px;height:42px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-size:19px}
.list{display:grid;gap:9px}.row{width:100%;min-height:70px;border:1px solid #edf1f5;background:#fff;border-radius:16px;padding:10px 12px;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;box-shadow:var(--shadow)}.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#ddebff;color:var(--blue);font-size:13px;font-weight:900}.avatar.role{background:var(--violet);color:#5c49a6}.avatar.system{background:#edf0f4;color:#657890}.avatar.att{background:#ddebff;color:#0d5ea8}.maincol{min-width:0}.name{font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview{margin-top:4px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.side{display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;gap:5px 7px;align-items:center;justify-items:end}.time{grid-column:1/3;font-size:10px;color:var(--muted)}.unread{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:900}.chev{font-size:24px;color:#7c8da3}.empty{padding:26px 14px;border:1px dashed var(--line);border-radius:14px;background:#fff;text-align:center;color:var(--muted);font-size:12px}
.group{margin:14px 3px 7px;font-size:10px;font-weight:900;letter-spacing:.08em;color:var(--muted)}.contact{width:100%;border:1px solid #edf1f5;background:#fff;border-radius:15px;padding:10px 11px;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left}.contact .avatar{width:44px;height:44px}
.chatView{display:none;flex:1;min-height:0;flex-direction:column}.chatView.on{display:flex}.chatHead{height:58px;flex:none;background:#fff;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto auto 1fr;gap:8px;align-items:center;padding:7px 10px}.back{border:0;background:transparent;font-size:22px}.chatHead .avatar{width:42px;height:42px}.chatBody{flex:1;overflow:auto;padding:13px}.bubbleLine{display:flex;margin:7px 0}.bubbleLine.mine{justify-content:flex-end}.bubble{max-width:82%;padding:9px 11px;border-radius:14px 14px 14px 4px;background:#fff;border:1px solid var(--line);font-size:13px;line-height:1.4}.mine .bubble{background:#ddecfb;border-color:#ddecfb;border-radius:14px 14px 4px 14px}.stamp{font-size:9px;color:var(--muted);text-align:right;margin-top:4px}.composer{flex:none;border-top:1px solid var(--line);background:#fff;padding:9px 10px calc(9px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr auto;gap:8px}.composer textarea{min-height:42px;max-height:105px;resize:none;border:1px solid var(--line);border-radius:13px;padding:10px 11px;outline:none}.send{width:42px;height:42px;border:0;border-radius:12px;background:var(--blue);color:#fff}.readonly{padding:14px;text-align:center;background:#fff;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.overlay{position:absolute;inset:0;background:#14243666;display:none;align-items:flex-end;z-index:30}.overlay.on{display:flex}.sheet{width:100%;max-height:86%;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:17px 14px calc(18px + env(safe-area-inset-bottom))}.sheet h3{margin:0 0 13px;font-size:17px}.tabs{display:flex;gap:7px;margin-bottom:12px}.tab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;font-size:11px;font-weight:800}.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}.note{font-size:10.5px;color:var(--muted);margin:0 0 10px;line-height:1.4}.toast{position:absolute;left:10%;bottom:24px;width:80%;padding:10px 12px;border-radius:12px;background:var(--ink);color:#fff;text-align:center;font-size:12px;display:none;z-index:40}.toast.on{display:block}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="brand">💬</div><div class="title">Mensajes</div><div id="globalBadge" class="global hidden"></div><button id="btnClose" class="close">×</button></header>
<section id="home" class="main">
  <div class="quick">
    <button id="btnSystem"><span class="ico">⚙️</span>SISTEMA</button>
    <button id="btnAttention"><span class="ico">👤</span>ATENCIÓN<span id="attBadge" class="att-badge hidden"></span></button>
    <button id="btnContacts"><span class="ico">👥</span>CONTACTOS</button>
  </div>
  <div class="toolbar"><div class="search"><input id="searchConv" placeholder="Buscar en conversaciones..."><span>⌕</span></div><button id="btnUnread" class="filter">No leídos</button><button id="btnNew" class="new">✎</button></div>
  <div id="convList" class="list"></div>
</section>
<section id="contacts" class="main hidden"><div class="search" style="margin-bottom:10px"><input id="searchContacts" placeholder="Buscar en contactos..."><span>⌕</span></div><div id="contactsList"></div></section>
<section id="chatView" class="chatView"><div class="chatHead"><button id="btnBack" class="back">←</button><div id="chatAvatar" class="avatar"></div><div><div id="chatTitle" class="name"></div><div id="chatType" class="preview"></div></div></div><div id="chatBody" class="chatBody"></div><div id="composer" class="composer"><textarea id="messageText" placeholder="Escribe un mensaje"></textarea><button id="btnSend" class="send">➤</button></div><div id="readonly" class="readonly hidden">Este canal es de solo lectura.</div></section>
<div id="overlay" class="overlay"><div class="sheet"><h3>Nueva conversación</h3><div class="tabs"><button class="tab on" data-tab="contacts">Contactos</button><button class="tab" data-tab="new">Buscar nuevo contacto</button></div><div id="paneContacts"><div class="search" style="margin-bottom:10px"><input id="searchNewContacts" placeholder="Buscar en contactos..."><span>⌕</span></div><div id="newContactsList"></div></div><div id="paneNew" class="hidden"><div class="search" style="margin-bottom:8px"><input id="searchExact" placeholder="Nombre completo o email"><span>⌕</span></div><div class="note">El resultado sólo se mostrará cuando exista coincidencia exacta con el nombre completo o el email.</div><div id="exactResult"></div></div></div></div>
<div id="toast" class="toast"></div>
</div>
<script>
(()=>{'use strict';
const CHANNEL='MNS_FRONTEND',VERSION='0.5.0',TIMEOUT=15000,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials=s=>String(s||'M').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
const uid=()=>crypto?.randomUUID?.()||`op-${Date.now()}-${Math.random().toString(36).slice(2)}`;
const state={context:null,active:null,unreadOnly:false,conversations:[],roles:[],users:[],messages:{}};const pending=new Map();
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').classList.remove('on'),2500)}
function request(action,payload={}){return new Promise((resolve,reject)=>{const id=uid(),timer=setTimeout(()=>{pending.delete(id);reject(new Error('No hubo respuesta de MNS.'))},TIMEOUT);pending.set(id,{resolve,reject,timer});parent.postMessage({channel:CHANNEL,id,action,payload},location.origin)})}
function fmt(v){if(!v)return'';const d=new Date(v),n=new Date();if(isNaN(d))return'';if(d.toDateString()===n.toDateString())return d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});if((n-d)/864e5<2)return'Ayer';return d.toLocaleDateString('es-MX',{day:'numeric',month:'short'}).replace('.','')}
function mapConv(c){return{_id:c._id,tipo:c.tipo,titulo:c.tipo==='USUARIO_ADMIN'?'Atención':c.tipo==='SISTEMA_USUARIO'?'Sistema':(c.titulo||'Conversación'),ultimoMensaje:c.ultimoMensaje||'',fecha:c.ultimoMensajeFecha||null,unread:Number(c.unread)||0,rolId:c.rolId||''}}
function glyph(c){if(c.tipo==='SISTEMA_USUARIO')return'⚙️';if(c.tipo==='USUARIO_ADMIN')return'👤';if(c.tipo==='USUARIO_ROL')return'👥';return initials(c.titulo)}
function cls(c){if(c.tipo==='SISTEMA_USUARIO')return'system';if(c.tipo==='USUARIO_ADMIN')return'att';if(c.tipo==='USUARIO_ROL')return'role';return''}
function renderConvs(){const q=$('#searchConv').value.trim().toLowerCase();let a=state.conversations.filter(c=>!q||c.titulo.toLowerCase().includes(q));if(state.unreadOnly)a=a.filter(c=>c.unread>0);a.sort((x,y)=>new Date(y.fecha||0)-new Date(x.fecha||0));$('#convList').innerHTML=a.length?a.map(c=>`<button class="row" data-conv="${esc(c._id)}"><div class="avatar ${cls(c)}">${esc(glyph(c))}</div><div class="maincol"><div class="name">${esc(c.titulo)}</div><div class="preview">${esc(c.ultimoMensaje||'Sin mensajes')}</div></div><div class="side"><span class="time">${fmt(c.fecha)}</span>${c.unread?`<span class="unread">${c.unread}</span>`:'<span></span>'}<span class="chev">›</span></div></button>`).join(''):'<div class="empty">No hay conversaciones que coincidan con el filtro.</div>';const total=state.conversations.reduce((n,c)=>n+c.unread,0),att=state.conversations.filter(c=>c.tipo==='USUARIO_ADMIN').reduce((n,c)=>n+c.unread,0);$('#globalBadge').textContent=total>99?'99+':total;$('#globalBadge').classList.toggle('hidden',!total);$('#attBadge').textContent=att>99?'99+':att;$('#attBadge').classList.toggle('hidden',!att)}
function renderContacts(target='#contactsList',filter=''){const q=filter.trim().toLowerCase(),roles=state.roles.filter(r=>r.asignado&&(!q||String(r.nombre||'').toLowerCase().includes(q))),users=state.users.filter(u=>!q||String(u.nombreVisible||'').toLowerCase().includes(q));$(target).innerHTML=`<div class="group">ROLES</div><div class="list">${roles.length?roles.map(r=>`<button class="contact" data-kind="ROLE" data-id="${esc(r.roleId)}"><div class="avatar role">👥</div><div class="name">${esc(r.nombre)}</div><span class="chev">›</span></button>`).join(''):'<div class="empty">Sin roles disponibles.</div>'}</div><div class="group">CONTACTOS</div><div class="list">${users.length?users.map(u=>`<button class="contact" data-kind="USER" data-id="${esc(u.memberId)}"><div class="avatar">${esc(initials(u.nombreVisible))}</div><div class="name">${esc(u.nombreVisible)}</div><span class="chev">›</span></button>`).join(''):'<div class="empty">Sin contactos disponibles.</div>'}</div>`}
async function loadBase(){const init=await request('mnsInit',{appId:state.context.appId,eoId:state.context.eoId});const [inbox,dir]=await Promise.all([request('mnsGetInbox',{appId:state.context.appId,eoId:state.context.eoId}),request('mnsGetDirectory',{appId:state.context.appId,eoId:state.context.eoId})]);state.conversations=(inbox.items||[]).map(mapConv);state.roles=dir.roles||[];state.users=dir.users||[];renderConvs();renderContacts()}
function show(v){$('#home').classList.toggle('hidden',v!=='home');$('#contacts').classList.toggle('hidden',v!=='contacts');$('#chatView').classList.toggle('on',v==='chat')}
function renderMessages(){const ms=state.messages[state.active?._id]||[];$('#chatBody').innerHTML=ms.length?ms.map(m=>{const d=new Date(m.fechaEnvio);return`<div class="bubbleLine ${m.propio?'mine':''}"><div class="bubble">${esc(m.texto)}<div class="stamp">${isNaN(d)?'':d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}</div></div></div>`}).join(''):'<div class="empty">Sin mensajes.</div>';requestAnimationFrame(()=>$('#chatBody').scrollTop=$('#chatBody').scrollHeight)}
async function openConversation(c){state.active=c;c.unread=0;renderConvs();$('#chatTitle').textContent=c.titulo;$('#chatType').textContent=c.tipo==='USUARIO_ROL'?'Rol':c.tipo==='SISTEMA_USUARIO'?'Sistema':c.tipo==='USUARIO_ADMIN'?'Atención':'Contacto';$('#chatAvatar').textContent=glyph(c);$('#chatAvatar').className=`avatar ${cls(c)}`;const ro=c.tipo==='SISTEMA_USUARIO';$('#composer').classList.toggle('hidden',ro);$('#readonly').classList.toggle('hidden',!ro);show('chat');$('#chatBody').innerHTML='<div class="empty">Cargando mensajes…</div>';try{const r=await request('mnsGetMessages',{conversationId:c._id,offset:0,limit:100});state.messages[c._id]=r.messages||[];renderMessages();await request('mnsMarkConversationRead',{conversationId:c._id}).catch(()=>{});const inbox=await request('mnsGetInbox',{appId:state.context.appId,eoId:state.context.eoId});state.conversations=(inbox.items||[]).map(mapConv);renderConvs()}catch(e){$('#chatBody').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
async function openSpecial(kind){try{const r=await request(kind==='ADMIN'?'mnsOpenAdmin':'mnsOpenSystem',{appId:state.context.appId,eoId:state.context.eoId});const c=mapConv(r.conversation);if(!state.conversations.some(x=>x._id===c._id))state.conversations.unshift(c);await openConversation(c)}catch(e){toast(e.message)}}
async function openContact(kind,id){try{const p={appId:state.context.appId,eoId:state.context.eoId},action=kind==='ROLE'?'mnsOpenRole':'mnsOpenDirect';if(kind==='ROLE')p.roleId=id;else p.targetMemberId=id;const r=await request(action,p),c=mapConv(r.conversation);if(!state.conversations.some(x=>x._id===c._id))state.conversations.unshift(c);$('#overlay').classList.remove('on');await openConversation(c)}catch(e){toast(e.message)}}
async function exactSearch(){const q=$('#searchExact').value.trim(),out=$('#exactResult');if(!q){out.innerHTML='';return}out.innerHTML='<div class="empty">Buscando…</div>';try{const r=await request('mnsSearchUserExact',{appId:state.context.appId,eoId:state.context.eoId,query:q}),u=r?.user;out.innerHTML=u?`<button class="contact" data-kind="NEWUSER" data-id="${esc(u.memberId)}"><div class="avatar">${esc(initials(u.nombreVisible))}</div><div class="name">${esc(u.nombreVisible)}</div><span class="chev">›</span></button>`:'<div class="empty">Sin coincidencia exacta.</div>'}catch{out.innerHTML='<div class="empty">No fue posible realizar la búsqueda.</div>'}}
async function send(){if(!state.active||state.active.tipo==='SISTEMA_USUARIO')return;const t=$('#messageText').value.trim();if(!t)return;$('#btnSend').disabled=true;try{await request('mnsSendMessage',{conversationId:state.active._id,texto:t,operationId:uid()});$('#messageText').value='';const r=await request('mnsGetMessages',{conversationId:state.active._id,offset:0,limit:100});state.messages[state.active._id]=r.messages||[];renderMessages();const inbox=await request('mnsGetInbox',{appId:state.context.appId,eoId:state.context.eoId});state.conversations=(inbox.items||[]).map(mapConv);renderConvs()}catch(e){toast(e.message)}finally{$('#btnSend').disabled=false}}
$('#searchConv').oninput=renderConvs;$('#searchContacts').oninput=()=>renderContacts('#contactsList',$('#searchContacts').value);$('#searchNewContacts').oninput=()=>renderContacts('#newContactsList',$('#searchNewContacts').value);let timer;$('#searchExact').oninput=()=>{clearTimeout(timer);timer=setTimeout(exactSearch,300)};$('#btnUnread').onclick=()=>{state.unreadOnly=!state.unreadOnly;$('#btnUnread').classList.toggle('on',state.unreadOnly);renderConvs()};$('#btnAttention').onclick=()=>openSpecial('ADMIN');$('#btnSystem').onclick=()=>openSpecial('SYSTEM');$('#btnContacts').onclick=()=>{renderContacts();show('contacts')};$('#btnNew').onclick=()=>{renderContacts('#newContactsList','');$('#overlay').classList.add('on')};$('#btnBack').onclick=()=>show('home');$('#btnClose').onclick=()=>{if($('#chatView').classList.contains('on')||!$('#contacts').classList.contains('hidden'))show('home');else parent.postMessage({channel:CHANNEL,type:'CLOSE'},location.origin)};$('#overlay').onclick=e=>{if(e.target===$('#overlay'))$('#overlay').classList.remove('on')};$$('[data-tab]').forEach(b=>b.onclick=()=>{$$('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));$('#paneContacts').classList.toggle('hidden',b.dataset.tab!=='contacts');$('#paneNew').classList.toggle('hidden',b.dataset.tab!=='new')});document.addEventListener('click',e=>{const c=e.target.closest('[data-conv]');if(c){const x=state.conversations.find(v=>v._id===c.dataset.conv);if(x)openConversation(x)}const d=e.target.closest('[data-kind]');if(d)openContact(d.dataset.kind,d.dataset.id)});$('#btnSend').onclick=send;$('#messageText').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
addEventListener('message',async e=>{if(e.origin!==location.origin||e.source!==parent)return;const m=e.data;if(!m||m.channel!==CHANNEL)return;if(m.type==='CONTEXT'){state.context=m.payload;try{await loadBase()}catch(err){toast(err.message);$('#convList').innerHTML=`<div class="empty">${esc(err.message)}</div>`}return}if(m.id&&pending.has(m.id)){const p=pending.get(m.id);clearTimeout(p.timer);pending.delete(m.id);m.ok?p.resolve(m.data):p.reject(new Error(m.error||'Error MNS.'))}});
renderConvs();renderContacts();parent.postMessage({channel:CHANNEL,type:'READY',version:VERSION},location.origin);
})();
</script>
</body>
</html>
