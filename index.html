<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <script>
    (() => {
      const VERSION = '0.3.8';
      const KEY = 'cpc_app_version';
      const current = localStorage.getItem(KEY);
      const url = new URL(window.location.href);

      if (current !== VERSION || url.searchParams.get('v') !== VERSION) {
        localStorage.setItem(KEY, VERSION);
        url.searchParams.set('v', VERSION);
        window.location.replace(url.toString());
      }
    })();
  </script>
  <title>CPC e-Learning</title>
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png?v=0.3.8" />
  <link rel="apple-touch-icon" href="assets/icon-192.png?v=0.3.8" />
  <link rel="manifest" href="manifest.webmanifest?v=0.3.8" />
  <link rel="stylesheet" href="styles.css?v=0.3.8" />
  <link rel="stylesheet" href="cpc-cursos.css?v=0.3.8" />
</head>
<body>
  <main id="app" aria-label="CPC e-Learning"></main>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <script type="module" src="app.js?v=0.3.8"></script>
  <script type="module" src="cpc-install.js?v=0.3.8"></script>
  <script type="module" src="cpc-cursos.js?v=0.3.8"></script>
  <script src="cpc-calendario-loader.js?v=0.3.8" defer></script>
  <script type="module" src="cpc-version.js?v=0.3.8"></script>
</body>
</html>
