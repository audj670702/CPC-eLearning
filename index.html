<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>CPC e-Learning</title>
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png?v=0.4.4" />
  <link rel="apple-touch-icon" href="assets/icon-192.png?v=0.4.4" />
  <link rel="manifest" href="manifest.webmanifest?v=0.4.4" />
  <link rel="stylesheet" href="styles.css?v=0.4.4" />
  <link rel="stylesheet" href="cpc-tv-install.css?v=0.4.4" />
  <link rel="stylesheet" href="cpc-cursos.css?v=0.4.4" />
  <link rel="stylesheet" href="cpc-mensajeria.css?v=0.4.4" />
</head>
<body>
  <main id="app" aria-label="CPC e-Learning"></main>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <script>
    // Puente CPC para HTTP Functions autenticadas.
    // Se conserva durante la prueba MNS para no alterar otros contratos CPC existentes.
    (() => {
      const nativeFetch = window.fetch.bind(window);
      const legacyPrefix = 'https://www.scad.mx/_functions/cpcMensajeria';
      const invokePrefix = 'https://www.wixapis.com/velo/v1/http/invoke/cpcMensajeria';

      window.fetch = (input, init) => {
        const rawUrl = typeof input === 'string' ? input : input?.url;
        if (typeof rawUrl === 'string' && rawUrl.startsWith(legacyPrefix)) {
          const targetUrl = invokePrefix + rawUrl.slice(legacyPrefix.length);
          return nativeFetch(targetUrl, init);
        }
        return nativeFetch(input, init);
      };
    })();
  </script>
  <script>
    // Sincroniza la versión visible con la versión de esta entrega.
    (() => {
      const version = 'v0.4.4 | 2026';
      const app = document.getElementById('app');
      const syncVersion = () => {
        const label = app?.querySelector('.app-footer .version');
        if (label && label.textContent !== version) label.textContent = version;
      };
      new MutationObserver(syncVersion).observe(app, { childList: true, subtree: true });
      syncVersion();
    })();
  </script>
  <script type="module" src="app.js?v=0.4.4"></script>
  <script type="module" src="cpc-install.js?v=0.4.4"></script>
  <script type="module" src="cpc-cursos.js?v=0.4.4"></script>
  <script type="module" src="cpc-mns-test.js?v=0.5.5"></script>
  <script src="cpc-calendario-loader.js?v=0.4.4" defer></script>
  <script src="cpc-infospe-deeplink.js?v=0.4.4" defer></script>
</body>
</html>
